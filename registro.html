<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HabitUp · Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
<div class="au">
<section class="hero">
<div class="lg" style="font-size:30px;margin:0">Habit<b>Up</b>
</div>
<img src="avatar.png" alt="Avatar de HabitUp" style="width:100%;max-width:300px;height:auto">
<div style="font:700 28px 'Space Grotesk'">Únete a HabitUp</div>
<p class="mu" style="margin:0">Pequeños hábitos, grandes cambios.</p>
</section>
<section class="fm">
<form class="c" id="registroForm">
<div>
<h1 style="font-size:28px">Crea tu cuenta</h1>
<p class="sub">Empieza a construir hábitos en minutos</p>
</div>
<div class="f">
<label for="nm">Nombre</label>
<input id="nm" name="name" type="text" placeholder="Tu nombre" autocomplete="name" required>
</div>
<div class="f">
<label for="em">Correo electrónico</label>
<input id="em" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
</div>
<div class="f">
<label for="pw">Contraseña</label>
<input id="pw" name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required aria-describedby="registro-msg">
<p id="registro-msg" class="form-error" role="alert" hidden></p>
</div>
<label class="r" style="gap:10px;font-size:13px">
<input type="checkbox" id="terms" name="terms" required>Acepto los términos y la política de privacidad</label>
<button class="btn" type="submit" style="width:100%">Crear cuenta</button>
<p class="mu" style="margin:0;text-align:center;font-size:14px">¿Ya tienes cuenta? <a class="lk" href="login.html">Inicia sesión</a>
</p>
</form>
</section>
</div>
<script type="module" src="js/registro.js?v=2"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
