<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HabitUp · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<div class="au">
<section class="hero">
<div class="lg" style="font-size:30px;margin:0">Habit<b>Up</b>
</div>
<img src="avatar.png" alt="Avatar de HabitUp" style="width:100%;max-width:300px;height:auto">
<div style="font:700 28px 'Space Grotesk'">Tu mejor versión empieza hoy</div>
<p class="mu" style="margin:0">Pequeños hábitos, grandes cambios.</p>
</section>
<section class="fm">
<form class="c" id="loginForm">
<div>
<h1 style="font-size:28px">Bienvenida de nuevo</h1>
<p class="sub">Inicia sesión para seguir con tu racha</p>
</div>
<div class="f">
<label for="em">Correo electrónico</label>
<input id="em" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
</div>
<div class="f">
<label for="pw">Contraseña</label>
<input id="pw" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
</div>
<div class="sp">
<a class="lk" href="#">¿Olvidaste tu contraseña?</a>
</div>
<button class="btn" type="submit" style="width:100%">Iniciar sesión</button>
<p class="mu" style="margin:0;text-align:center;font-size:14px">¿Aún no tienes cuenta? <a class="lk" href="registro.html">Regístrate</a>
</p>
</form>
</section>
</div>
<script type="module" src="js/login.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
